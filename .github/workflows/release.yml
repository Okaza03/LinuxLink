# Builds every package for x86_64 and ARM64 and publishes a GitHub release
# when a version tag (vX.Y.Z) is pushed. Run it by hand for a dry run: it
# builds everything and uploads it as a workflow artifact, publishing nothing.
#
# File names here are relied on by the in-app updater; see docs/releasing.md.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: Binary packages (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, deb_arch: amd64, runner: ubuntu-22.04 }
          - { arch: aarch64, deb_arch: arm64, runner: ubuntu-22.04-arm }
    # The oldest supported Ubuntu, so the binary runs on older glibc too.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        run: echo "VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME#v}" = "$VERSION"
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev desktop-file-utils file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.arch }}
      - run: cargo test --workspace --locked
      - name: Binary, tarball and AppDir
        run: cargo xtask dist
      - name: AppImage
        run: |
          curl -fsSL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage"
          chmod +x appimagetool
          ARCH=${{ matrix.arch }} ./appimagetool --appimage-extract-and-run \
            target/dist/AppDir "target/dist/LinuxLink-$VERSION-${{ matrix.arch }}.AppImage"
      - name: Debian package
        run: |
          cargo install cargo-deb --locked
          cargo deb -p linuxlink --no-build -o "target/dist/linuxlink_${VERSION}_${{ matrix.deb_arch }}.deb"
      - name: RPM package
        run: |
          cargo install cargo-generate-rpm --locked
          cargo generate-rpm -p apps/LinuxLink -o "target/dist/linuxlink-$VERSION-1.${{ matrix.arch }}.rpm"
      - name: Smoke test
        run: |
          "target/dist/LinuxLink-$VERSION-${{ matrix.arch }}.AppImage" --appimage-extract-and-run --version
          dpkg-deb --info "target/dist/linuxlink_${VERSION}_${{ matrix.deb_arch }}.deb"
          ls -l target/dist
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            target/dist/*.AppImage
            target/dist/*.deb
            target/dist/*.rpm
            target/dist/*.tar.gz

  flatpak:
    name: Flatpak (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        run: echo "VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
          # Ubuntu 24.04 blocks the user namespaces bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean --disable-rofiles-fuse \
            --repo=flatpak-repo flatpak-build packaging/flatpak/io.github.Okaza03.LinuxLink.yml
      - name: Bundle
        run: |
          mkdir -p dist
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo "dist/LinuxLink-$VERSION-${{ matrix.arch }}.flatpak" io.github.Okaza03.LinuxLink
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}
          if-no-files-found: error
          path: dist/*.flatpak

  arch:
    name: Arch Linux package (x86_64)
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed git rust libpulse pipewire-pulse hicolor-icon-theme
      - uses: actions/checkout@v4
      - name: Build with makepkg
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          useradd -m builder
          mkdir /tmp/pkg
          cp packaging/arch/PKGBUILD /tmp/pkg/
          # The PKGBUILD downloads the tagged source; give it this checkout instead.
          git archive --prefix="LinuxLink-$VERSION/" -o "/tmp/pkg/linuxlink-$VERSION.tar.gz" HEAD
          chown -R builder /tmp/pkg
          (cd /tmp/pkg && sudo -u builder makepkg --noconfirm)
          mkdir -p dist
          cp "/tmp/pkg/linuxlink-$VERSION-1-x86_64.pkg.tar.zst" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: arch-x86_64
          if-no-files-found: error
          path: dist/*.pkg.tar.zst

  publish:
    name: Publish
    needs: [binaries, flatpak, arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        run: echo "VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Release notes
        run: python3 .github/scripts/release_notes.py "$VERSION" dist > release-notes.md && cat release-notes.md
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "LinuxLink $VERSION" --notes-file release-notes.md --verify-tag
      - name: Keep the dry run's output
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: release-preview
          path: |
            dist
            release-notes.md
