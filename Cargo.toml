[workspace]
resolver = "2"
members = ["apps/LinuxLink", "xtask"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Okaza03 and LinuxLink contributors"]
repository = "https://github.com/Okaza03/LinuxLink"
